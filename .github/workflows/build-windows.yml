name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Self-test (source)
        run: python app.py --self-test

      - name: Build EXE with PyInstaller
        run: pyinstaller --onefile --windowed --name "NovaTG翻译" --clean app.py

      - name: Self-test (frozen EXE)
        run: ./dist/NovaTG翻译.exe --self-test

      - name: Publish GitHub Release
        shell: bash
        run: |
          gh release delete v1.0 --cleanup-tag --yes 2>/dev/null || true
          gh release create v1.0 "dist/NovaTG翻译.exe" \
            --title "Nova TG 翻译客户端 v1.0" \
            --notes "Windows 免安装版，双击即用，无需安装 Python。首次运行需在软件内填写 api_id / api_hash（申请见 README）。"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
